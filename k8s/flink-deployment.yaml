apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink-cdc-job
  namespace: flink-cdc-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink-cdc-job-edit
  namespace: flink-cdc-demo
subjects:
  - kind: ServiceAccount
    name: flink-cdc-job
    namespace: flink-cdc-demo
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: oracle-dwaf-to-kafka
  namespace: flink-cdc-demo
spec:
  image: flink:1.20.5-scala_2.12-java17
  imagePullPolicy: IfNotPresent
  flinkVersion: v1_20
  serviceAccount: flink-cdc-job
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "1"
    state.checkpoints.dir: file:///opt/flink/checkpoints
    execution.checkpointing.interval: "10 s"
    execution.checkpointing.mode: EXACTLY_ONCE
    restart-strategy.type: fixed-delay
    restart-strategy.fixed-delay.attempts: "10"
    restart-strategy.fixed-delay.delay: "10 s"
  podTemplate:
    spec:
      nodeSelector:
        kubernetes.io/hostname: cluster01
      initContainers:
        - name: initialize-checkpoint-dir
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /checkpoints && chown -R 9999:9999 /checkpoints"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: checkpoints
              mountPath: /checkpoints
      containers:
        - name: flink-main-container
          env:
            - name: ORACLE_CDC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pipeline-secrets
                  key: oracle-cdc-password
            - name: ORACLE_CDC_USER
              value: C##FLINK
            - name: ORACLE_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pipeline-secrets
                  key: oracle-app-password
          volumeMounts:
            - name: job-artifacts
              mountPath: /opt/flink/usrlib
              readOnly: true
            - name: checkpoints
              mountPath: /opt/flink/checkpoints
      volumes:
        - name: job-artifacts
          hostPath:
            path: /var/lib/flink-cdc-demo/job
            type: Directory
        - name: checkpoints
          hostPath:
            path: /var/lib/flink-cdc-demo/checkpoints
            type: DirectoryOrCreate
  jobManager:
    resource:
      memory: "1024m"
      cpu: 0.5
  taskManager:
    resource:
      memory: "2048m"
      cpu: 1
  job:
    jarURI: local:///opt/flink/usrlib/flink-oracle-kafka-cdc-1.0.0.jar
    parallelism: 1
    upgradeMode: stateless
    state: running
    args:
      - --oracle-host
      - oracle.flink-cdc-demo.svc.cluster.local
      - --oracle-port
      - "1521"
      - --oracle-database
      - XE
      - --oracle-pdb
      - XEPDB1
      - --oracle-schema
      - APPUSER
      - --oracle-app-user
      - APPUSER
      - --kafka-bootstrap
      - kafka.flink-cdc-demo.svc.cluster.local:9092
      - --kafka-topic
      - dwaf-file-events
