apiVersion: v1
kind: Namespace
metadata:
  name: flink-cdc-demo
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: flink-cdc-demo
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: client
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: flink-cdc-demo
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      nodeSelector:
        kubernetes.io/hostname: cluster02
      initContainers:
        - name: initialize-data-dir
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /data && chown -R 1000:1000 /data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: kafka
          image: apache/kafka:3.9.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: client
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            - name: KAFKA_CLUSTER_ID
              value: MkU3OEVBNTcwNTJENDM2Qk
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka.flink-cdc-demo.svc.cluster.local:9092
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@kafka-0.kafka.flink-cdc-demo.svc.cluster.local:9093
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_HEAP_OPTS
              value: -Xms512m -Xmx512m
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          readinessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
      volumes:
        - name: data
          hostPath:
            path: /var/lib/flink-cdc-demo/kafka
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: oracle
  namespace: flink-cdc-demo
spec:
  selector:
    app: oracle
  ports:
    - name: listener
      port: 1521
      targetPort: 1521
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oracle
  namespace: flink-cdc-demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: oracle
  template:
    metadata:
      labels:
        app: oracle
    spec:
      nodeSelector:
        kubernetes.io/hostname: cluster02
      initContainers:
        - name: initialize-data-dir
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /data && chown -R 54321:54321 /data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: oracle
          image: gvenzl/oracle-xe:21-slim
          imagePullPolicy: IfNotPresent
          ports:
            - name: listener
              containerPort: 1521
          env:
            - name: ORACLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pipeline-secrets
                  key: oracle-sys-password
            - name: APP_USER
              value: APPUSER
            - name: APP_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pipeline-secrets
                  key: oracle-app-password
            - name: ORACLE_CDC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pipeline-secrets
                  key: oracle-cdc-password
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            exec:
              command: ["healthcheck.sh"]
            initialDelaySeconds: 60
            timeoutSeconds: 10
            periodSeconds: 20
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /opt/oracle/oradata
      volumes:
        - name: data
          hostPath:
            path: /var/lib/flink-cdc-demo/oracle
            type: DirectoryOrCreate
